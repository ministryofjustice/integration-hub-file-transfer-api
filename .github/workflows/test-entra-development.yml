name: Test Entra development authentication

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: file-transfer-api-entra-development
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: file-transfer-api-entra-development
    permissions:
      contents: read
      id-token: write
    env:
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CONSUMER_CLIENT_ID: ${{ vars.ENTRA_CONSUMER_CLIENT_ID }}
      ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check token authentication and upload a development file
        run: python scripts/smoke-github-entra.py
